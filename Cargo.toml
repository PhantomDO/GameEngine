[workspace]
resolver = "3"
members = ["engine/core", "sandbox"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/PhantomDO/Levain"

[workspace.dependencies]
levain-core = { path = "engine/core" }

# Ce bloc remplace les 60 lignes de .clang-tidy (ADR-0010).
#
# unsafe_code est refusé par défaut : les rares endroits qui en auront besoin — les
# frontières GPU — le lèveront localement avec un #[allow] et un commentaire de sûreté,
# ce qui les rend repérables par un grep.
[workspace.lints.rust]
unsafe_code = "deny"

# clippy::all seulement, pas pedantic. Même raisonnement que pour clang-tidy en M0.2 :
# on active ce qui attrape de vrais défauts, pas ce qui lance des débats. pedantic pousse
# notamment vers must_use partout, ce que l'ADR-0009 a explicitement écarté sous le nom
# de « décoration maximale ». On élargira en une ligne si le besoin apparaît.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
