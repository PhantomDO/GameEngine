name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une PR poussée trois fois de suite n'occupe pas trois fois les runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Les noms de jobs sont repris à l'identique de la CI C++ (« debug » et non « dev »,
    # le nom du profil cargo) : ce sont eux que la protection de `main` exige comme checks
    # requis. Les renommer rendrait `main` infusionnable, GitHub attendant indéfiniment
    # deux checks qui ne viendraient jamais.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    # Jobs Windows non bloquants tant que Donnovan n'a pas de machine Windows, comme en
    # M0.2. Ils tournent quand même : c'est le seul endroit qui vérifie la cible MSVC.
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-debug,     os: ubuntu-latest,  profile: dev,     experimental: false }
          - { name: linux-release,   os: ubuntu-latest,  profile: release, experimental: false }
          - { name: windows-debug,   os: windows-latest, profile: dev,     experimental: true }
          - { name: windows-release, os: windows-latest, profile: release, experimental: true }

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      # rustup est préinstallé sur les images GitHub : pas d'action tierce à ajouter,
      # comme on s'y était tenu côté C++ en refusant ilammy/msvc-dev-cmd.
      - name: Chaîne Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.name }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.name }}-

      - run: cargo build --profile ${{ matrix.profile }} --workspace
      - run: cargo test --profile ${{ matrix.profile }} --workspace

      # Le sandbox reste lancé en plus des tests, comme en M0.2 : sa sortie dit quelle
      # cible a réellement été produite, ce qu'un test n'affiche pas dans les logs.
      - run: cargo run --profile ${{ matrix.profile }} -q -p levain-sandbox

      # Format et lint une seule fois : ce sont des propriétés des sources, pas de la
      # configuration de build.
      - name: Format
        if: matrix.name == 'linux-debug'
        run: cargo fmt --all --check

      - name: Lint
        if: matrix.name == 'linux-debug'
        run: cargo clippy --workspace --all-targets -- -D warnings
